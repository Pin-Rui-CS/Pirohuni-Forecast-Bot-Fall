name: Model scores on resolved questions

# Scores each ensemble model's own forecast (and the bot's submitted one) on the
# last N resolved questions in the forecast library, then compares every pair of
# models. No LLM calls: it reads the library and Metaculus only.
# Results: the run page summary, and the "model-scores" artifact
# (summary.md + per_forecast.csv).

"on":
  workflow_dispatch:
    inputs:
      last_n:
        description: "How many of the most recently resolved questions to score"
        required: false
        default: "50"
        type: string
      question_type:
        description: "Question type"
        required: false
        default: all
        type: choice
        options:
          - all
          - binary
          - multiple_choice
          - numeric
      tournament:
        description: "Only questions in a tournament whose name or slug contains this text (blank = all)"
        required: false
        default: ""
        type: string
      since:
        description: "Only questions resolved on or after this date, YYYY-MM-DD (blank = no limit)"
        required: false
        default: ""
        type: string
      refresh_outcomes:
        description: "Check Metaculus for newly resolved questions first"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  model_scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Python dependencies (Poetry)
        run: poetry install --no-interaction --no-root

      - name: Record newly resolved outcomes
        if: ${{ inputs.refresh_outcomes }}
        run: poetry run python eval_tools/score_outcomes.py --max-checks 150
        env:
          PYTHONUNBUFFERED: "1"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Score each model
        run: |
          args=(--last-n "${LAST_N}" --question-type "${QUESTION_TYPE}" --out model-scores)
          if [ -n "${TOURNAMENT}" ]; then args+=(--tournament "${TOURNAMENT}"); fi
          if [ -n "${SINCE}" ]; then args+=(--since "${SINCE}"); fi
          poetry run python eval_tools/model_scores.py "${args[@]}"
        env:
          PYTHONUNBUFFERED: "1"
          LAST_N: ${{ inputs.last_n }}
          QUESTION_TYPE: ${{ inputs.question_type }}
          TOURNAMENT: ${{ inputs.tournament }}
          SINCE: ${{ inputs.since }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scores-${{ github.run_id }}
          path: model-scores/
          retention-days: 90
          if-no-files-found: warn
