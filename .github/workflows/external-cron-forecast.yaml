name: Forecast via external cron

"on":
  workflow_dispatch:
    inputs:
      tournament:
        description: "Space-separated tournament aliases or IDs"
        required: false
        default: "fall-2026-ai"
        type: string
      num_runs:
        description: "Ignored (kept so existing cron calls stay valid). Runs = ticked forecasters + the raw-research run."
        required: false
        default: ""
        type: string
      cost_limit:
        description: "OpenRouter cost hard limit for this run; blank uses repo defaults"
        required: false
        default: ""
        type: string
      no_submit:
        description: "Run without submitting predictions to Metaculus"
        required: false
        default: false
        type: boolean
      # The external cron sends only the four inputs above, so the defaults below
      # are what scheduled runs use. Same settings as test-one-metaculus-cup-question.
      research_models:
        description: "SETTING 1 - research. qwen = the tested Qwen setup (free; evidence plan stays on Sonnet; ~45-70 min/question). original = paid Sonnet/Opus, no Qwen."
        required: false
        default: "qwen"
        type: choice
        options:
          - "qwen"
          - "original"
      forecaster_gpt6_astra:
        description: "Forecaster (reads the brief): GPT-6 Astra (~5x Opus per token)"
        required: false
        default: true
        type: boolean
      forecaster_claude_opus:
        description: "Forecaster (reads the brief): Claude Opus 5.5"
        required: false
        default: true
        type: boolean
      forecaster_gpt56_sol:
        description: "Forecaster (reads the brief): GPT-6 Sol"
        required: false
        default: true
        type: boolean
      forecaster_claude_sonnet:
        description: "Forecaster (reads the brief): Claude Sonnet 5"
        required: false
        default: false
        type: boolean
      forecaster_qwen:
        description: "Forecaster (reads the brief): Qwen 3.8 27B (free)"
        required: false
        default: false
        type: boolean
      raw_research_forecaster:
        description: "Raw-research forecaster: one extra run that reads the raw research instead of the brief (catches evidence the brief dropped). Qwen is free."
        required: false
        default: "Qwen 3.8 27B (free)"
        type: choice
        options:
          - "Claude Sonnet 5"
          - "Claude Opus 5.5"
          - "GPT-6 Sol"
          - "GPT-6 Astra"
          - "Qwen 3.8 27B (free)"
          - "none"

# Prevent overlapping external cron runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Python dependencies (Poetry)
        run: poetry install --no-interaction --no-root

      # apiagent-kit (public data APIs) runs under Node. Optional: if either
      # step fails the bridge reports "unavailable" and research falls back to
      # scraping, so neither may fail the forecast.
      - name: Set up Node for apiagent-kit
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apiagent-kit/package-lock.json

      - name: Install apiagent-kit
        continue-on-error: true
        run: npm ci --prefix apiagent-kit --no-audit --no-fund

      - name: Install Playwright browser dependencies
        run: poetry run playwright install --with-deps chromium

      - name: Verify secrets are configured
        run: |
          echo "::group::API Key Configuration"
          echo "METACULUS_TOKEN:      $([ -n '${{ secrets.METACULUS_TOKEN }}'      ] && echo 'SET' || echo 'MISSING')"
          echo "LLM_PROVIDER:         ${{ vars.LLM_PROVIDER || 'openrouter' }}"
          echo "OPENROUTER_API_KEY:   $([ -n '${{ secrets.OPENROUTER_API_KEY }}'   ] && echo 'SET' || echo 'MISSING')"
          echo "SOCLAAS_API_KEY:      $([ -n '${{ secrets.SOCLAAS_API_KEY }}'      ] && echo 'SET' || echo 'MISSING')"
          echo "RESEARCH_MODELS:      ${{ inputs.research_models || 'qwen' }}  (TIER1/TIER2_MODEL repo variables are not used by this workflow)"
          echo "OPENAI_API_KEY:       $([ -n '${{ secrets.OPENAI_API_KEY }}'       ] && echo 'SET' || echo 'MISSING')"
          echo "ASKNEWS_CLIENT_ID:    $([ -n '${{ secrets.ASKNEWS_CLIENT_ID }}'    ] && echo 'SET' || echo 'MISSING')"
          echo "ASKNEWS_SECRET:       $([ -n '${{ secrets.ASKNEWS_SECRET }}'       ] && echo 'SET' || echo 'MISSING')"
          echo "ASKNEWS_API_KEY:      $([ -n '${{ secrets.ASKNEWS_API_KEY }}'      ] && echo 'SET' || echo 'MISSING')"
          echo "SERPAPI_API_KEY:      $([ -n '${{ secrets.SERPAPI_API_KEY }}'      ] && echo 'SET' || echo 'MISSING')"
          echo "FIRECRAWL_API_KEY:    $([ -n '${{ secrets.FIRECRAWL_API_KEY }}'    ] && echo 'SET' || echo 'MISSING')"
          echo "TAVILY_API_KEY:       $([ -n '${{ secrets.TAVILY_API_KEY }}'       ] && echo 'SET' || echo 'MISSING')"
          echo "::endgroup::"

      - name: Show optional runtime configuration
        run: |
          echo "::group::Runtime Configuration"
          echo "METACULUS_MAX_CONCURRENT_REQUESTS=${METACULUS_MAX_CONCURRENT_REQUESTS}"
          echo "METACULUS_REQUEST_INTERVAL=${METACULUS_REQUEST_INTERVAL}"
          echo "INITIAL_API_GET_RETRY_WAIT_SECONDS=${INITIAL_API_GET_RETRY_WAIT_SECONDS}"
          echo "ASKNEWS_CACHE_MODE=${ASKNEWS_CACHE_MODE}"
          echo "OPENROUTER_COST_HARD_LIMIT_USD=${OPENROUTER_COST_HARD_LIMIT_USD}"
          echo "DISPATCH_TOURNAMENT=${DISPATCH_TOURNAMENT}"
          echo "DISPATCH_NUM_RUNS=${DISPATCH_NUM_RUNS:-repo default}"
          echo "DISPATCH_COST_LIMIT=${DISPATCH_COST_LIMIT:-repo default}"
          echo "DISPATCH_NO_SUBMIT=${DISPATCH_NO_SUBMIT}"
          echo "ENABLE_ASKNEWS_RESEARCH=${ENABLE_ASKNEWS_RESEARCH}"
          echo "ENABLE_RESOLUTION_SOURCE_RESEARCH=${ENABLE_RESOLUTION_SOURCE_RESEARCH}"
          echo "ENABLE_SERPAPI_RESEARCH=${ENABLE_SERPAPI_RESEARCH}"
          echo "ENABLE_FIRECRAWL_RESEARCH=${ENABLE_FIRECRAWL_RESEARCH}"
          echo "ENABLE_TAVILY_RESEARCH=${ENABLE_TAVILY_RESEARCH}"
          echo "ENABLE_PREDICTION_MARKET_RESEARCH=${ENABLE_PREDICTION_MARKET_RESEARCH}"
          echo "FIRECRAWL_SEARCH_TBS=${FIRECRAWL_SEARCH_TBS}"
          echo "::endgroup::"
        env:
          METACULUS_MAX_CONCURRENT_REQUESTS: ${{ vars.METACULUS_MAX_CONCURRENT_REQUESTS || '1' }}
          METACULUS_REQUEST_INTERVAL: ${{ vars.METACULUS_REQUEST_INTERVAL || '3.0' }}
          INITIAL_API_GET_RETRY_WAIT_SECONDS: ${{ vars.INITIAL_API_GET_RETRY_WAIT_SECONDS || '3.0' }}
          ASKNEWS_CACHE_MODE: ${{ vars.ASKNEWS_CACHE_MODE || 'no_cache' }}
          OPENROUTER_COST_HARD_LIMIT_USD: ${{ vars.OPENROUTER_COST_HARD_LIMIT_USD || '0' }}
          ENABLE_ASKNEWS_RESEARCH: ${{ vars.ENABLE_ASKNEWS_RESEARCH || 'true' }}
          ENABLE_RESOLUTION_SOURCE_RESEARCH: ${{ vars.ENABLE_RESOLUTION_SOURCE_RESEARCH || 'true' }}
          ENABLE_SERPAPI_RESEARCH: ${{ vars.ENABLE_SERPAPI_RESEARCH || 'true' }}
          ENABLE_FIRECRAWL_RESEARCH: ${{ vars.ENABLE_FIRECRAWL_RESEARCH || 'true' }}
          ENABLE_TAVILY_RESEARCH: ${{ vars.ENABLE_TAVILY_RESEARCH || 'true' }}
          ENABLE_PREDICTION_MARKET_RESEARCH: ${{ vars.ENABLE_PREDICTION_MARKET_RESEARCH || 'true' }}
          FIRECRAWL_SEARCH_TBS: ${{ vars.FIRECRAWL_SEARCH_TBS || '' }}
          DISPATCH_TOURNAMENT: ${{ inputs.tournament || 'fall-2026-ai' }}
          DISPATCH_NUM_RUNS: ${{ inputs.num_runs }}
          DISPATCH_COST_LIMIT: ${{ inputs.cost_limit }}
          DISPATCH_NO_SUBMIT: ${{ inputs.no_submit && 'true' || 'false' }}

      - name: Run forecasting bot
        run: |
          set -o pipefail

          run_args=(--mode tournament)

          if [ -n "$DISPATCH_TOURNAMENT" ]; then
            read -r -a tournaments <<< "$DISPATCH_TOURNAMENT"
            run_args+=(--tournament "${tournaments[@]}")
          fi

          # Setting 2: one brief run per ticked model, in checkbox order (the first
          # is also the binary tiebreaker), plus one raw-research run on the dropdown
          # model. forecasters.base.heterogeneous_run_setup swaps the LAST run onto
          # HETEROGENEOUS_RUN_MODEL with the raw research, so that run is added as
          # run N+1 rather than replacing a ticked model.
          # Fallbacks = the input defaults, in case a cron call arrives without them.
          FC_GPT6_ASTRA="${FC_GPT6_ASTRA:-true}"; FC_CLAUDE_OPUS="${FC_CLAUDE_OPUS:-true}"
          FC_GPT56_SOL="${FC_GPT56_SOL:-true}"; FC_CLAUDE_SONNET="${FC_CLAUDE_SONNET:-false}"
          FC_QWEN="${FC_QWEN:-false}"; RAW_FORECASTER="${RAW_FORECASTER:-Qwen 3.8 27B (free)}"
          MODELS=()
          [ "$FC_GPT6_ASTRA" = "true" ] && MODELS+=("openai/gpt-6-astra")
          [ "$FC_CLAUDE_OPUS" = "true" ] && MODELS+=("anthropic/claude-opus-5.5")
          [ "$FC_GPT56_SOL" = "true" ] && MODELS+=("openai/gpt-6-sol")
          [ "$FC_CLAUDE_SONNET" = "true" ] && MODELS+=("anthropic/claude-sonnet-5")
          [ "$FC_QWEN" = "true" ] && MODELS+=("qwen3.8:27b")
          if [ "${#MODELS[@]}" -eq 0 ]; then echo "Tick at least one brief forecaster." >&2; exit 1; fi
          case "$RAW_FORECASTER" in
            "Claude Sonnet 5") RAW_MODEL="anthropic/claude-sonnet-5" ;;
            "Claude Opus 5.5") RAW_MODEL="anthropic/claude-opus-5.5" ;;
            "GPT-6 Sol") RAW_MODEL="openai/gpt-6-sol" ;;
            "GPT-6 Astra") RAW_MODEL="openai/gpt-6-astra" ;;
            "Qwen 3.8 27B (free)") RAW_MODEL="qwen3.8:27b" ;;
            "none") RAW_MODEL="" ;;
            *) echo "Unknown raw_research_forecaster: $RAW_FORECASTER" >&2; exit 1 ;;
          esac
          export FORECASTER_MODELS="$(IFS=,; echo "${MODELS[*]}")"
          export FORECASTER_TIEBREAKER_MODEL="${MODELS[0]}"
          if [ -n "$RAW_MODEL" ]; then
            export HETEROGENEOUS_RUN_ENABLED=true HETEROGENEOUS_RUN_MODEL="$RAW_MODEL"
            NUM_RUNS=$(( ${#MODELS[@]} + 1 ))
          else
            export HETEROGENEOUS_RUN_ENABLED=false
            NUM_RUNS=${#MODELS[@]}
          fi
          if [ -n "$DISPATCH_NUM_RUNS" ]; then
            echo "Note: num_runs=$DISPATCH_NUM_RUNS is ignored; the forecaster settings give $NUM_RUNS runs."
          fi
          run_args+=(--num-runs "$NUM_RUNS")
          echo "Research models: $RESEARCH_MODELS | brief forecasters: $FORECASTER_MODELS | raw research: ${RAW_MODEL:-none} | $NUM_RUNS runs"

          if [ -n "$DISPATCH_COST_LIMIT" ]; then
            run_args+=(--cost-limit "$DISPATCH_COST_LIMIT")
          fi

          if [ "$DISPATCH_NO_SUBMIT" = "true" ]; then
            run_args+=(--no-submit)
          fi

          poetry run python forecasting_bot.py "${run_args[@]}" 2>&1 | tee bot_run.log
          echo "Clean LLM result files created:"
          find docs/runs -type f -print 2>/dev/null || true
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOCLAAS_API_KEY: ${{ secrets.SOCLAAS_API_KEY }}
          # TIER1_MODEL / TIER2_MODEL are deliberately NOT passed: they move research
          # and forecasters together. SETTING 1 picks research, SETTING 2 forecasters.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Selects which API every LLM call goes to. Defaults to openrouter,
          # so this is inert until the repo variable is set to "openai".
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
          LLM_ROUTING: ${{ vars.LLM_ROUTING || vars.LLM_PROVIDER || 'openrouter' }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          METACULUS_MAX_CONCURRENT_REQUESTS: ${{ vars.METACULUS_MAX_CONCURRENT_REQUESTS || '1' }}
          METACULUS_REQUEST_INTERVAL: ${{ vars.METACULUS_REQUEST_INTERVAL || '3.0' }}
          INITIAL_API_GET_RETRY_WAIT_SECONDS: ${{ vars.INITIAL_API_GET_RETRY_WAIT_SECONDS || '3.0' }}
          ASKNEWS_CACHE_MODE: ${{ vars.ASKNEWS_CACHE_MODE || 'no_cache' }}
          OPENROUTER_COST_HARD_LIMIT_USD: ${{ vars.OPENROUTER_COST_HARD_LIMIT_USD || '0' }}
          ENABLE_ASKNEWS_RESEARCH: ${{ vars.ENABLE_ASKNEWS_RESEARCH || 'true' }}
          ENABLE_RESOLUTION_SOURCE_RESEARCH: ${{ vars.ENABLE_RESOLUTION_SOURCE_RESEARCH || 'true' }}
          ENABLE_SERPAPI_RESEARCH: ${{ vars.ENABLE_SERPAPI_RESEARCH || 'true' }}
          ENABLE_FIRECRAWL_RESEARCH: ${{ vars.ENABLE_FIRECRAWL_RESEARCH || 'true' }}
          ENABLE_TAVILY_RESEARCH: ${{ vars.ENABLE_TAVILY_RESEARCH || 'true' }}
          ENABLE_PREDICTION_MARKET_RESEARCH: ${{ vars.ENABLE_PREDICTION_MARKET_RESEARCH || 'true' }}
          FIRECRAWL_SEARCH_TBS: ${{ vars.FIRECRAWL_SEARCH_TBS || '' }}
          DISPATCH_TOURNAMENT: ${{ inputs.tournament || 'fall-2026-ai' }}
          DISPATCH_NUM_RUNS: ${{ inputs.num_runs }}
          DISPATCH_COST_LIMIT: ${{ inputs.cost_limit }}
          DISPATCH_NO_SUBMIT: ${{ inputs.no_submit && 'true' || 'false' }}
          # How many questions run at once. Unset in code means unbounded, which
          # with Qwen research (~1 h/question behind a 24 req/min gate) leaves later
          # questions queueing until their own timeout fires. 2 fits ~12 questions
          # in GitHub's 6 h job limit; the next cron run picks up the rest, because
          # already-forecast questions are skipped.
          QUESTION_CONCURRENCY: ${{ vars.QUESTION_CONCURRENCY || '2' }}
          # SETTING 2 (inputs a cron call omits take their defaults).
          FC_GPT6_ASTRA: ${{ inputs.forecaster_gpt6_astra }}
          FC_CLAUDE_OPUS: ${{ inputs.forecaster_claude_opus }}
          FC_GPT56_SOL: ${{ inputs.forecaster_gpt56_sol }}
          FC_CLAUDE_SONNET: ${{ inputs.forecaster_claude_sonnet }}
          FC_QWEN: ${{ inputs.forecaster_qwen }}
          RAW_FORECASTER: ${{ inputs.raw_research_forecaster || 'Qwen 3.8 27B (free)' }}
          RESEARCH_MODELS: ${{ inputs.research_models || 'qwen' }}
          # SETTING 1 = qwen. On an original run each is off or the code default
          # (never empty: the timeouts are parsed with int()/float()).
          QWEN_RESEARCH_LABELS: ${{ (inputs.research_models || 'qwen') == 'qwen' && 'recommended' || '' }}
          QWEN_LADDER: ${{ (inputs.research_models || 'qwen') == 'qwen' && '1' || '' }}
          QWEN_START_EFFORT: ${{ (inputs.research_models || 'qwen') == 'qwen' && 'serp-scrape-extract=medium,asknews-filter=medium' || '' }}
          QWEN_BRIEF_PROMPT: ${{ (inputs.research_models || 'qwen') == 'qwen' && 'v3' || '' }}
          SOCLAAS_PRECOMPRESS_MODE: ${{ (inputs.research_models || 'qwen') == 'qwen' && 'experimental' || 'off' }}
          SOCLAAS_PRECOMPRESS_OVERFLOW: ${{ (inputs.research_models || 'qwen') == 'qwen' && 'truncate' || 'pause' }}
          SOCLAAS_PRECOMPRESS_CHECKS: ${{ (inputs.research_models || 'qwen') == 'qwen' && 'advisory' || 'strict' }}
          # Qwen research measured 44-67 min per question; the default limit is 20 min.
          QUESTION_TIMEOUT_SECONDS: ${{ (inputs.research_models || 'qwen') == 'qwen' && '10800' || '1200' }}
          ARTIFACT_RETRY_TIMEOUT_SECONDS: ${{ (inputs.research_models || 'qwen') == 'qwen' && '3600' || '150' }}

      - name: Publish run to the forecast library
        # Never fails or blocks forecasting: a no-op until the SUPABASE_*
        # secrets exist, and a database outage marks only this step.
        if: always()
        continue-on-error: true
        run: poetry run python eval_tools/publish_runs.py docs/runs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload bot log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-cron-bot-run-log-${{ github.run_id }}
          path: bot_run.log
          retention-days: 14

      - name: Upload clean LLM result logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-cron-llm-results-${{ github.run_id }}
          path: |
            docs/runs/**
            data/qwen-precompression/**
          if-no-files-found: warn
          retention-days: 14
